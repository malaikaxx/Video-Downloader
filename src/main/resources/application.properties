server.port=8080
spring.application.name=StreamVault

# ==========================================
# MICROSOFT SQL SERVER CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=StreamVaultDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=CampusAtCloud
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Thymeleaf (Disable cache for real-time frontend updates)
spring.thymeleaf.cache=false

# Path to yt-dlp binary (leave as "yt-dlp" if installed globally in PATH, or put full path e.g. C:/tools/yt-dlp.exe)
streamvault.ytdlp.path=C:/Users/ADMIN/Desktop/streamvault-video-downloader/yt-dlp.exe      