<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault — Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

<header class="border-b border-slate-800 bg-slate-900/80 px-6 py-4 flex justify-between items-center">
    <a href="/login" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center">
            <i class="fa-solid fa-cloud-arrow-down text-white text-xl"></i>
        </div>
        <span class="text-xl font-extrabold text-white">StreamVault</span>
    </a>
    <div class="space-x-4 text-sm">
        <a href="/register" class="text-cyan-400 hover:underline">Register</a>
        <a href="/contact" class="text-slate-300 hover:text-white">Contact Us</a>
    </div>
</header>

<main class="max-w-md w-full mx-auto px-6 py-12 flex-grow flex items-center justify-center">
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-500/15 border border-red-500/40 text-red-300 text-sm" th:text="${errorMsg}"></div>
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-sm" th:text="${successMsg}"></div>

        <h1 class="text-2xl font-bold text-white text-center mb-2">Welcome Back</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Sign in with your username or email</p>

        <form th:action="@{/auth/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username or Email</label>
                <input type="text" name="loginId" required placeholder="Enter username or email"
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input type="password" name="password" required placeholder="Enter password"
                       class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-500 text-white font-bold shadow-lg">
                Sign In
            </button>
        </form>
        <p class="text-center text-sm text-slate-400 mt-6">
            Don't have an account? <a href="/register" class="text-cyan-400 hover:underline font-semibold">Register here</a>
        </p>
    </div>
</main>

<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    &copy; 2026 StreamVault Video Downloader
</footer>
</body>
</html>
