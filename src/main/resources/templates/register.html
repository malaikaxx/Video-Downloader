<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault — New User Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

<header class="border-b border-slate-800 bg-slate-900/80 px-6 py-4 flex justify-between items-center">
    <a href="/login" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center">
            <i class="fa-solid fa-cloud-arrow-down text-white text-xl"></i>
        </div>
        <span class="text-xl font-extrabold text-white">StreamVault</span>
    </a>
    <div class="space-x-4 text-sm">
        <a href="/login" class="text-cyan-400 hover:underline">Sign In</a>
        <a href="/contact" class="text-slate-300 hover:text-white">Contact Us</a>
    </div>
</header>

<main class="max-w-lg w-full mx-auto px-6 py-12 flex-grow flex items-center justify-center">
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <!-- Error Banner -->
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-500/15 border border-red-500/40 text-red-300 text-sm flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${errorMsg}"></span>
        </div>

        <h1 class="text-2xl font-bold text-white text-center mb-2">Create Account</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Enter your credentials to register in database</p>

        <form th:action="@{/auth/register}" method="post" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username</label>
                    <input type="text" name="username" required placeholder="Choose username"
                           class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com"
                           class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Birthdate</label>
                    <input type="date" name="birthdate" required
                           class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Phone Number</label>
                    <input type="tel" name="phoneNumber" required placeholder="+92 300 1234567"
                           class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required minlength="6" placeholder="Create a secure password"
                       class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full py-3.5 mt-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 text-white font-bold shadow-lg transition">
                Complete Registration
            </button>
        </form>
        <p class="text-center text-sm text-slate-400 mt-6">
            Already have an account? <a href="/login" class="text-cyan-400 hover:underline font-semibold">Sign In</a>
        </p>
    </div>
</main>

<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    &copy; 2026 StreamVault Video Downloader
</footer>
</body>
</html>
