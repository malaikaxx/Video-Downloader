<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault — Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

<header class="border-b border-slate-800 bg-slate-900/80 px-6 py-4 flex justify-between items-center">
    <a href="/" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 flex items-center justify-center">
            <i class="fa-solid fa-cloud-arrow-down text-white text-xl"></i>
        </div>
        <span class="text-xl font-extrabold text-white">StreamVault</span>
    </a>
    <div class="space-x-4 text-sm">
        <a href="/" class="text-cyan-400 hover:underline">Home</a>
        <a href="/login" class="text-slate-300 hover:text-white">Sign In</a>
    </div>
</header>

<main class="max-w-lg w-full mx-auto px-6 py-12 flex-grow flex items-center justify-center">
    <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div th:if="${successMsg}" class="mb-6 p-4 rounded-xl bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-sm" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="mb-6 p-4 rounded-xl bg-red-500/15 border border-red-500/40 text-red-300 text-sm" th:text="${errorMsg}"></div>

        <h1 class="text-2xl font-bold text-white text-center mb-2">Contact Us</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Send us your feedback or inquiries</p>

        <form th:action="@{/auth/contact}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                <input type="text" name="fullName" required placeholder="Enter your name"
                       class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email</label>
                <input type="email" name="email" required placeholder="you@example.com"
                       class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Subject</label>
                <input type="text" name="subject" required placeholder="Subject"
                       class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Message</label>
                <textarea name="message" rows="4" required placeholder="Write your message..."
                          class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-indigo-500"></textarea>
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-cyan-500 text-white font-bold shadow-lg">
                Send Message
            </button>
        </form>
    </div>
</main>

<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    &copy; 2026 StreamVault Video Downloader
</footer>
</body>
</html>
